<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Route mini game card</title>
  <desc id="desc">A premium dark card inviting visitors to play Cloud Route, a small interactive infrastructure game.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="900" y1="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#082f49"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" x2="760" y1="35" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.86 0 0 0 0 0.8 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="900" height="260" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="28.5" stroke="url(#accent)" stroke-opacity="0.75" stroke-width="3"/>
  <circle cx="125" cy="65" r="85" fill="#22d3ee" opacity="0.11"/>
  <circle cx="760" cy="205" r="120" fill="#8b5cf6" opacity="0.12"/>
  <path d="M92 176 C180 78 272 82 352 150 C440 225 540 214 617 137 C681 74 746 73 812 121" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="13 16" opacity="0.85"/>
  <g filter="url(#glow)">
    <rect x="88" y="146" width="68" height="68" rx="20" fill="#020617" stroke="#22d3ee" stroke-width="3"/>
    <path d="M111 177h22M122 166v22" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <rect x="384" y="119" width="68" height="68" rx="20" fill="#020617" stroke="#14b8a6" stroke-width="3"/>
    <path d="M408 152h21M418.5 141.5v21" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
    <rect x="720" y="88" width="68" height="68" rx="20" fill="#020617" stroke="#a78bfa" stroke-width="3"/>
    <path d="M744 121h21M754.5 110.5v21" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="70" y="64" fill="#e5f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">INTERACTIVE MINI GAME</text>
  <text x="70" y="105" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Cloud Route</text>
  <text x="70" y="134" fill="#b6c7d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Route packets through cloud nodes before the timer expires.</text>
  <rect x="645" y="188" width="184" height="46" rx="23" fill="url(#accent)"/>
  <text x="686" y="217" fill="#04111d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Play now →</text>
</svg>
